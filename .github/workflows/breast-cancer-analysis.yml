name: Breast cancer processed-expression analysis

on:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_gse183947.R"
      - "scripts/pathway_enrichment_gse183947.py"
      - ".github/workflows/breast-cancer-analysis.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-gse183947:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install Bioconductor limma
        run: |
          install.packages("BiocManager", repos = "https://cloud.r-project.org")
          BiocManager::install("limma", ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Run paired breast cancer analysis
        run: Rscript scripts/analyze_gse183947.R

      - name: Run directional pathway enrichment
        run: python scripts/pathway_enrichment_gse183947.py

      - name: Upload analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse183947-breast-cancer-analysis
          path: cancer-results/
          if-no-files-found: warn
          retention-days: 30
